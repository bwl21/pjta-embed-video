<!doctype html>
<html lang="de-DE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Einbettungs-Video</title>

    <style>
      body { margin: 0; }
      main { padding: 24px; font-family: system-ui, sans-serif; }
      .video-container { max-width: 1100px; }
      .video-wrapper {
        position: relative;
        width: 100%;
        padding-top: 56.25%; /* 16:9 */
        border-radius: 16px;
        overflow: hidden;
        background: #111;
      }
      .video-wrapper iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Demo Einbettungs-Video</h1>

      <section class="video-container">
        <div class="video-wrapper">
          <iframe
            id="videoFrame"
            src="about:blank"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
            title="PJT Video"
          ></iframe>
        </div>

        <p id="debug" style="opacity:.7; margin-top:12px;"></p>
      </section>
    </main>

    <!-- Das Vimeo-API-Skript kann bleiben, es stört nicht -->
    <script async src="https://player.vimeo.com/api/player.js"></script>

    <!-- WICHTIG: lädt dein main.ts -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
